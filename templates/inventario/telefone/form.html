{% extends "base.html" %} {% block title %}Novo Telefone IP - HelpDesk{%
endblock %} {% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h1 class="h3 mb-1 fw-bold">Cadastrar Telefone IP</h1>
      <p class="text-muted mb-0">Vincule um novo ramal ao inventário.</p>
    </div>
    <a href="/inventario/telefone/" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Voltar
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
          <form method="POST" action="/inventario/telefone/">
            <div class="row g-3 mb-4">
              <div class="col-12 border-bottom pb-2 mb-2">
                <h6 class="fw-bold text-primary mb-0">
                  <i class="bi bi-telephone-plus me-2"></i>Informações do Ramal
                </h6>
              </div>
              <div class="col-md-3">
                <label
                  class="form-label small fw-bold text-muted text-uppercase"
                  >Patrimônio</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="patrimonio"
                  maxlength="4"
                  pattern="[0-9]{1,4}"
                  inputmode="numeric"
                  placeholder="Ex: 1234"
                  required
                />
              </div>
              <div class="col-md-3">
                <label
                  class="form-label small fw-bold text-muted text-uppercase"
                  >Ramal</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="ramal"
                  required
                  placeholder="Ex: 2001"
                />
              </div>
              <div class="col-md-3">
                <label
                  class="form-label small fw-bold text-muted text-uppercase"
                  >Modelo</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="modelo"
                  placeholder="Ex: Intelbras TIP 125"
                />
              </div>
              <div class="col-md-3">
                <label
                  class="form-label small fw-bold text-muted text-uppercase"
                  >TAG / Identificação</label
                >
                <input
                  type="text"
                  class="form-control"
                  name="tag"
                  placeholder="Ex: RH-01"
                />
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-12 border-bottom pb-2 mb-2">
                <h6 class="fw-bold text-primary mb-0">
                  <i class="bi bi-person-badge me-2"></i>Localização e
                  Atribuição
                </h6>
              </div>
              <div class="col-md-6">
                <label
                  class="form-label small fw-bold text-muted text-uppercase"
                  >Setor</label
                >
                <select class="form-select select2-search" name="setor_id">
                  <option value="">Selecione um setor...</option>
                  {% for s in setores %}
                  <option value="{{ s.id }}">{{ s.nome }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-6">
                <label
                  class="form-label small fw-bold text-muted text-uppercase"
                  >Responsável</label
                >
                <select class="form-select select2-search" name="responsavel_id">
                  <option value="">Selecione um colaborador...</option>
                  {% for u in usuarios %}
                  <option value="{{ u.id }}" data-setor="{{ u.setor_id }}">{{ u.nome_completo }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-12">
                <label
                  class="form-label small fw-bold text-muted text-uppercase"
                  >Observações</label
                >
                <textarea
                  class="form-control"
                  name="observacoes"
                  rows="3"
                ></textarea>
              </div>
            </div>

            <div class="d-flex justify-content-end pt-3 border-top">
              <a
                href="/inventario/telefone/"
                class="btn btn-link text-secondary me-3 text-decoration-none"
                >Cancelar</a
              >
              <button
                type="submit"
                class="btn btn-primary px-5 fw-bold shadow-sm"
              >
                <i class="bi bi-check-lg"></i> Cadastrar Aparelho
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% if dados %}
<script>window.__dadosForm = {{ dados | tojson }};</script>
{% endif %}
{% endblock %}
