{% extends "base.html" %}

{% block title %}Editar Linha: {{ linha.numero }}{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-1 small">
          <li class="breadcrumb-item"><a href="/inventario/" class="text-decoration-none">Inventário</a></li>
          <li class="breadcrumb-item"><a href="/inventario/linha/" class="text-decoration-none">Linhas</a></li>
          <li class="breadcrumb-item active" aria-current="page">Editar</li>
        </ol>
      </nav>
      <h1 class="h3 mb-1 fw-bold">Editar Linha</h1>
      <p class="text-muted mb-0">Editando {{ linha.numero }}</p>
    </div>
    <a href="/inventario/linha/" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Voltar
    </a>
  </div>

  <div class="row justify-content-center">
    <div class="col-lg-10">
      <div class="card border-0 shadow-sm rounded-3">
        <div class="card-body p-4">
          <form method="post" action="/inventario/linha/{{ linha.id }}/update">
            <div class="row g-3 mb-4">
              <div class="col-12 border-bottom pb-2 mb-2">
                <h6 class="fw-bold text-primary mb-0">
                  <i class="bi bi-sim me-2"></i>Dados da Linha
                </h6>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-muted text-uppercase">Número</label>
                <input type="text" class="form-control" name="numero" value="{{ linha.numero }}" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold text-muted text-uppercase">Operadora</label>
                <input type="text" class="form-control" name="operadora" value="{{ linha.operadora }}" required>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-12 border-bottom pb-2 mb-2">
                <h6 class="fw-bold text-primary mb-0">
                  <i class="bi bi-phone me-2"></i>Vinculação
                </h6>
              </div>
              <div class="col-md-12">
                <label class="form-label small fw-bold text-muted text-uppercase">Celular Vinculado</label>
                <select class="form-select" name="celular_id">
                  <option value="">Sem vínculo...</option>
                  {% for c in celulares %}
                  <option value="{{ c.patrimonio.id }}" {% if linha.celular and linha.celular.patrimonio.id == c.patrimonio.id %}selected{% endif %}>
                    {{ c.patrimonio.nome_identificador }}
                  </option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-12 border-bottom pb-2 mb-2">
                <h6 class="fw-bold text-primary mb-0">
                  <i class="bi bi-card-text me-2"></i>Observações
                </h6>
              </div>
              <div class="col-12">
                <label class="form-label small fw-bold text-muted text-uppercase">Observações</label>
                <textarea class="form-control" name="observacoes" rows="3">{{ linha.observacoes or '' }}</textarea>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center pt-3 border-top">
              <button type="button" class="btn btn-outline-danger" onclick="deletarLinha({{ linha.id }})">Excluir</button>
              <div>
                <a href="/inventario/linha/" class="btn btn-link text-secondary me-3 text-decoration-none">Cancelar</a>
                <button type="submit" class="btn btn-primary px-5 fw-bold shadow-sm">
                  <i class="bi bi-check-lg me-2"></i> Atualizar Linha
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function deletarLinha(id) {
    if (confirm("Tem certeza que deseja excluir?")) {
      fetch(`/inventario/linha/${id}/delete`, { method: 'DELETE' })
      .then(res => res.json())
      .then(data => { if(data.deleted === 'ok') window.location.href = '/inventario/linha/'; });
    }
  }
</script>
{% endblock %}
