<!doctype html>
<html lang="pt-br" data-bs-theme="{{ request.cookies.get('theme', 'light') }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Erro interno - HelpDesk IT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .error-card {
      text-align: center;
      background: var(--bs-body-bg);
      border-radius: 16px;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      padding: 3rem;
      max-width: 420px;
    }
    .error-card h1 { font-size: 4rem; font-weight: 800; color: #dc2626; margin-bottom: 0; }
    .error-card h2 { font-size: 1.25rem; font-weight: 600; color: var(--bs-body-color); }
    .error-card p { color: var(--bs-secondary-color); margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <div class="error-card">
    <h1>500</h1>
    <h2>Erro interno do servidor</h2>
    <p>Ocorreu um erro inesperado. Tente novamente mais tarde.</p>
    <a href="/" class="btn btn-primary">Voltar ao Início</a>
  </div>
</body>
</html>
