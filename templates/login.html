<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - HelpDesk IT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primary-color: #0f172a;
      --accent-color: #3b82f6;
    }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      font-family: 'Inter', 'Segoe UI', Roboto, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      padding: 2.5rem;
      width: 100%;
      max-width: 400px;
    }
    .login-logo {
      width: 64px;
      height: 64px;
      background: var(--accent-color);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
    .login-logo i {
      font-size: 2rem;
      color: white;
    }
    .login-card h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary-color);
      text-align: center;
      margin-bottom: 0.25rem;
    }
    .login-card .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }
    .form-control:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 0 0.2rem rgba(59, 130, 246, 0.25);
    }
    .btn-primary {
      background-color: var(--accent-color);
      border: none;
      font-weight: 600;
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      width: 100%;
    }
    .btn-primary:hover {
      background-color: #2563eb;
    }
    .forgot-password {
      font-size: 0.85rem;
      text-align: center;
      margin-top: 1rem;
    }
    .forgot-password a {
      color: #64748b;
      text-decoration: none;
    }
    .forgot-password a:hover {
      color: var(--accent-color);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <i class="bi bi-tools"></i>
    </div>
    <h1>HelpDesk IT</h1>
    <p class="subtitle">Faça login para continuar</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show py-2" role="alert">
            {{ message | e }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('auth.login_post') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3">
        <label for="username" class="form-label fw-medium">Usuário</label>
        <input type="text" class="form-control" id="username" name="username" required autofocus autocomplete="username">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-medium">Senha</label>
        <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary">Entrar</button>
      <div class="forgot-password">
        <a href="#"><i class="bi bi-question-circle me-1"></i>Esqueceu sua senha? Entre em contato com o administrador.</a>
      </div>
    </form>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
