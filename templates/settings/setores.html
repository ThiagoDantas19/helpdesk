{% extends "base.html" %}
{% block title %}Setores - HelpDesk{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
    <div>
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-1 small">
          <li class="breadcrumb-item"><a href="/settings/" class="text-decoration-none">Configurações</a></li>
          <li class="breadcrumb-item active" aria-current="page">Setores</li>
        </ol>
      </nav>
      <h1 class="h3 mb-0 fw-bold">Setores</h1>
    </div>
    <a href="/settings/setor/new" class="btn btn-primary d-flex align-items-center shadow-sm fw-bold">
      <i class="bi bi-plus-lg me-1"></i> Novo Setor
    </a>
  </div>

  <div class="card border-0 shadow-sm overflow-hidden">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="ps-3" style="width: 80px;">ID</th>
            <th>NOME</th>
            <th class="text-end pe-3">AÇÕES</th>
          </tr>
        </thead>
        <tbody>
          {% for s in setores %}
          <tr>
            <td class="ps-3 text-muted font-monospace">#{{ s.id }}</td>
            <td class="fw-medium">{{ s.nome }}</td>
            <td class="text-end pe-3">
              <div class="btn-group">
                <a href="/settings/setor/{{ s.id }}/edit" class="btn btn-sm btn-outline-primary border-0" title="Editar"><i class="bi bi-pencil-square"></i></a>
                <button class="btn btn-sm btn-outline-danger border-0" title="Excluir"
                        c-delete="/settings/setor/{{ s.id }}/delete"
                        c-redirect="/settings/setor/"
                        onclick="return confirm('Excluir setor &#39;{{ s.nome }}&#39;? Os cargos vinculados também serão removidos.')">
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </td>
          </tr>
          {% else %}
          <tr>
            <td colspan="3" class="text-center py-5">
              <i class="bi bi-building text-muted display-4 d-block mb-3"></i>
              <p class="text-muted mb-0">Nenhum setor cadastrado.</p>
              <a href="/settings/setor/new" class="btn btn-sm btn-link mt-2">Cadastrar agora</a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
