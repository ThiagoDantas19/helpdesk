{% extends "base.html" %}
{% block title %}{{ 'Editar' if cargo else 'Novo' }} Cargo - HelpDesk{% endblock %}
{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-6">
      <nav aria-label="breadcrumb">
        <ol class="breadcrumb mb-2 small">
          <li class="breadcrumb-item"><a href="/settings/" class="text-decoration-none">Configurações</a></li>
          <li class="breadcrumb-item"><a href="/settings/cargo/" class="text-decoration-none">Cargos</a></li>
          <li class="breadcrumb-item active" aria-current="page">{{ 'Editar' if cargo else 'Novo' }}</li>
        </ol>
      </nav>

      <h1 class="h3 fw-bold mb-4">{{ 'Editar Cargo' if cargo else 'Novo Cargo' }}</h1>

      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <form method="POST" action="{{ '/settings/cargo/%d/update' % cargo.id if cargo else '/settings/cargo/' }}">
            <div class="mb-3">
              <label for="nome" class="form-label fw-medium">Nome do Cargo</label>
              <input type="text" class="form-control" id="nome" name="nome" required
                     value="{{ cargo.nome if cargo else '' }}"
                     placeholder="Ex: Analista, Coordenador(a), Técnico(a)...">
            </div>
            <div class="mb-3">
              <label for="setor_id" class="form-label fw-medium">Setor</label>
              <select class="form-select select2-search" id="setor_id" name="setor_id" required>
                <option value="">Selecione o setor...</option>
                {% for s in setores %}
                <option value="{{ s.id }}" {{ 'selected' if cargo and cargo.setor.id == s.id else '' }}>{{ s.nome }}</option>
                {% endfor %}
              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-primary fw-bold">{{ 'Salvar' if cargo else 'Criar' }}</button>
              <a href="/settings/cargo/" class="btn btn-outline-secondary">Cancelar</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
