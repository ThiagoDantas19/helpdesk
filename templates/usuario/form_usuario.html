{% extends "base.html" %}

{% block title %}Novo Usuário{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="mb-4">
        <a href="/user/" class="btn btn-link p-0 text-decoration-none text-muted small">← Voltar para lista</a>
        <h1 class="h3 mt-2">Novo Usuário</h1>
    </div>

    <div class="card shadow-sm border-0 mb-3">
        <div class="card-header bg-white py-3">
            <h6 class="mb-0 fw-bold"><i class="bi bi-person-badge me-2"></i>Dados Profissionais e Pessoais</h6>
        </div>
        <div class="card-body">
            <form method="post" action="/user/">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted text-uppercase">Nome Completo</label>
                        <input class="form-control" name="nome_completo" required placeholder="Nome Completo" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small text-muted text-uppercase">Email Pessoal</label>
                        <input class="form-control" type="text" name="email" placeholder="email@exemplo.com (opcional)" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Usuário (login)</label>
                        <input class="form-control" name="username" id="username" required placeholder="exemplo.username" />
                        <div id="username-feedback" class="form-text"></div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Senha</label>
                        <input class="form-control" type="password" name="password" placeholder="Mínimo 6 caracteres" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Setor</label>
                        <select class="form-select select2-search" name="setor_id" id="setor" required>
                            <option value="">Selecione o setor...</option>
                            {% for s in setores %}
                            <option value="{{ s.id }}">{{ s.nome }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Cargo</label>
                        <select class="form-select select2-search" name="cargo_id" id="cargo" required disabled>
                            <option value="">Selecione o setor primeiro...</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Nível de Acesso</label>
                        <select class="form-select" name="tipo_acesso">
                            <option value="usuario">Usuário (abre e vê próprios chamados)</option>
                            <option value="tecnico">Técnico (vê todos chamados + inventário)</option>
                            <option value="admin">Administrador (acesso total)</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Tipo de Vínculo</label>
                        <select class="form-select" name="tipo_vinculo">
                            <option value="efetivo">Efetivo</option>
                            <option value="freelancer">Freelancer</option>
                            <option value="terceirizado">Terceirizado</option>
                            <option value="estagiario">Estagiário</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Telefone Pessoal</label>
                        <input class="form-control" name="telefone" id="telefone" placeholder="(00) 00000-0000" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Data de Admissão</label>
                        <input class="form-control" name="data_admissao" id="data_admissao" placeholder="dd/mm/aaaa" maxlength="10" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Email Corporativo</label>
                        <input class="form-control" name="email_corporativo" placeholder="exemplo@empresa.com.br" />
                    </div>

                    <div class="col-12">
                        <label class="form-label fw-bold small text-muted text-uppercase">Observações</label>
                        <textarea class="form-control" name="observacoes" rows="3" placeholder="Anotações internas sobre o usuário..."></textarea>
                    </div>
                </div>

                <hr class="my-4" />
                
                <h6 class="mb-3 text-primary fw-bold"><i class="bi bi-shield-check me-2"></i>Onboarding & Acessos</h6>
                
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-bold small text-muted text-uppercase">Perfil Intelbras (Acesso Físico)</label>
                        <input class="form-control" name="perfil_intelbras" placeholder="Ex: Acesso Total" />
                    </div>
                    
                    <div class="col-12">
                        <label class="form-label fw-bold small text-muted text-uppercase d-block mb-2">Checklist de TI</label>
                        <div class="d-flex flex-wrap gap-3 p-3 bg-light border rounded">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="acesso_ad" value="1" id="acesso_ad" />
                                <label class="form-check-label fw-medium" for="acesso_ad">Cadastro no AD</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="acesso_sistema" value="1" id="acesso_sistema" />
                                <label class="form-check-label fw-medium" for="acesso_sistema">Acesso no Sistema</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="acesso_sharepoint" value="1" id="acesso_sharepoint" />
                                <label class="form-check-label fw-medium" for="acesso_sharepoint">Sharepoint</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="biometria_dedo" value="1" id="biometria_dedo" />
                                <label class="form-check-label fw-medium" for="biometria_dedo">Biometria Digital</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="biometria_facial" value="1" id="biometria_facial" />
                                <label class="form-check-label fw-medium" for="biometria_facial">Biometria Facial</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 pt-3 border-top">
                    <button type="submit" class="btn btn-primary px-5 shadow-sm">
                        <i class="bi bi-save me-2"></i>Salvar Novo Usuário
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const PARTICULAS = new Set(['de', 'da', 'do', 'das', 'dos', 'e', 'a', 'o', 'del', 'y', 'la', 'las', 'los', 'el', 'van', 'von']);

    function normalizar(texto) {
        return texto
            .trim()
            .toLowerCase()
            .normalize('NFD')
            .replace(/[\u0300-\u036f]/g, '')
            .replace(/[^a-z0-9\s]/g, ' ')
            .split(/\s+/)
            .filter(Boolean);
    }

    function gerarLogin(nome) {
        const nomes = normalizar(nome);
        if (!nomes.length) return '';
        const significativos = nomes.filter(p => !PARTICULAS.has(p));
        if (!significativos.length) return nomes[0];
        const primeiro = significativos[0];
        const ultimo = significativos[significativos.length - 1];
        return primeiro === ultimo ? primeiro : primeiro + '.' + ultimo;
    }

    const inputNome = document.querySelector('[name="nome_completo"]');
    const inputUsername = document.getElementById('username');
    const inputPassword = document.querySelector('[name="password"]');
    const usernameFeedback = document.getElementById('username-feedback');

    let passwordAuto = false;
    let usernameCheckTimer = null;

    function verificarUsername() {
        const username = inputUsername.value.trim();
        const form = inputUsername.closest('.col-md-4');
        clearTimeout(usernameCheckTimer);

        if (!username) {
            form.classList.remove('is-invalid');
            inputUsername.classList.remove('is-invalid', 'is-valid');
            usernameFeedback.textContent = '';
            return;
        }

        usernameCheckTimer = setTimeout(() => {
            fetch('/user/verificar-username?username=' + encodeURIComponent(username))
                .then(r => r.json())
                .then(data => {
                    inputUsername.classList.remove('is-invalid', 'is-valid');
                    usernameFeedback.textContent = '';
                    if (data.disponivel) {
                        inputUsername.classList.add('is-valid');
                        usernameFeedback.textContent = 'Disponível';
                        usernameFeedback.classList.add('text-success');
                        usernameFeedback.classList.remove('text-danger');
                    } else {
                        inputUsername.classList.add('is-invalid');
                        usernameFeedback.textContent = 'Este usuário já existe.';
                        usernameFeedback.classList.add('text-danger');
                        usernameFeedback.classList.remove('text-success');
                    }
                })
                .catch(() => {
                    inputUsername.classList.remove('is-invalid', 'is-valid');
                    usernameFeedback.textContent = '';
                });
        }, 300);
    }

    inputUsername.addEventListener('input', verificarUsername);

    inputNome.addEventListener('input', function() {
        const login = gerarLogin(this.value);
        if (login) {
            inputUsername.value = login;
            if (passwordAuto || !inputPassword.value) {
                inputPassword.value = login;
                passwordAuto = true;
            }
            verificarUsername();
        }
    });

    inputPassword.addEventListener('input', function() {
        passwordAuto = false;
    });

    document.getElementById('setor').addEventListener('change', function() {
      const setorId = this.value;
      const selectCargo = document.getElementById('cargo');

      if (setorId) {
        selectCargo.disabled = false;
        fetch('/user/buscar-cargos?setor_id=' + setorId)
          .then(response => response.text())
          .then(html => {
            selectCargo.innerHTML = html;
          })
          .catch(error => {
            console.error('Erro ao buscar cargos:', error);
            selectCargo.innerHTML = '<option value="">Erro ao carregar cargos</option>';
          });
      } else {
        selectCargo.disabled = true;
        selectCargo.innerHTML = '<option value="">Selecione o setor primeiro...</option>';
      }
    });

    const inputTelefone = document.getElementById('telefone');
    inputTelefone.addEventListener('input', function() {
      let digits = this.value.replace(/\D/g, '').slice(0, 11);
      if (digits.length > 10) {
        this.value = `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
      } else if (digits.length > 6) {
        this.value = `(${digits.slice(0, 2)}) ${digits.slice(2, 6)}-${digits.slice(6)}`;
      } else if (digits.length > 2) {
        this.value = `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
      } else if (digits.length > 0) {
        this.value = `(${digits}`;
      } else {
        this.value = '';
      }
    });

    function mascaraData(input) {
      input.addEventListener('input', function() {
        let digits = this.value.replace(/\D/g, '').slice(0, 8);
        if (digits.length > 4) {
          this.value = `${digits.slice(0, 2)}/${digits.slice(2, 4)}/${digits.slice(4)}`;
        } else if (digits.length > 2) {
          this.value = `${digits.slice(0, 2)}/${digits.slice(2)}`;
        } else if (digits.length > 0) {
          this.value = digits;
        } else {
          this.value = '';
        }
      });
    }
    mascaraData(document.getElementById('data_admissao'));
</script>
{% endblock %}
